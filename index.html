<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INT32: Once in a Runtime</title>
<style>
  :root { --bg: #0e0f11; --card: #17191c; --line: #2a2d32; --text: #ece6d8; --dim: #a8a196; --accent: #f2b84b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .brand { font-weight: 800; letter-spacing: 0.04em; font-size: 28px; line-height: 1.1; margin: 0; }
  .sub { color: var(--accent); letter-spacing: 0.2em; font-size: 12px; margin: 6px 0 0; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 28px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    color: var(--text); text-decoration: none; }
  .card:hover { border-color: var(--accent); }
  .card span { color: var(--dim); display: block; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
<header>
<p class="brand">INT32</p>
<p class="sub">ONCE IN A RUNTIME</p>
</header>
<p>A co-op wave survival FPS for iPhone and iPad, where every creature is generated from a single 32-bit number.</p>
